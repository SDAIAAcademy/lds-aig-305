<section>
<h2>اليوم 1: من البلاغ إلى الإشعار</h2>
<ol>
<li><p>في شركة طيران افتراضية، أرسل وكيل تذكير الرحلات 400 رسالة فيها اسم مسافر آخر ورقم حجزه، بعد أن مُنح أداة بحث أوسع مما يحتاج.</p><ul><li><b>أ.</b> تجاوز الوكيل صلاحياته</li><li><b>ب.</b> مخرجات ضارة من الوكيل</li><li><b>ج.</b> تسرب بيانات شخصية</li><li><b>د.</b> شبه حادثة لم تكتمل</li></ul></li>
<li><p>في جهة أخرى، أرسل لك زميل سجل وكيل المدفوعات بعد أن «رتّبه» وحوّل أوقاته. بصمته لا تطابق البيان، والتصدير الأصلي موجود في منصة السجلات.</p><ul><li><b>أ.</b> تسجّلها منفصلة، وتعمل على تصدير من المنصة تطابق بصمته البيان</li><li><b>ب.</b> تستخدمها كما هي، فالمحتوى لم يتغيّر وإنما تغيّر ترتيب الأوقات وحده</li><li><b>ج.</b> تعيد حساب بصمتها وتضعها في البيان بدل البصمة القديمة</li><li><b>د.</b> تحذفها فورًا حتى لا يستخدمها أحد في الفريق</li></ul></li>
<li><p>في شركة تأمين صحي أخرى، عرض تطبيقها نتائج فحص 30 عضوًا على أعضاء آخرين لمدة ساعتين. لا يُعرف بعد من فتح الصفحة.</p><ul><li><b>أ.</b> لم يطّلع أحد على نتائج فحصك، وبياناتك في أمان تام</li><li><b>ب.</b> حدث خطأ بشري من أحد مهندسينا، وقد اتخذنا الإجراء اللازم بحقه</li><li><b>ج.</b> ربما تأثرت بعض البيانات، وربما لم تتأثر، ونحن نتابع الأمر</li><li><b>د.</b> عُرضت نتيجة فحصك على عضو آخر ساعتين، ولا نعرف بعد هل فُتحت</li></ul></li>
<li><p>أرسل مساعد حجوزات فندقية تأكيدات حجز إلى ثلاثة نزلاء، في كل منها رقم جواز سفر نزيل آخر. ما نوع البلاغ بقاعدة الأسبقية في دليل مِجَنّ؟</p><ul><li><b>أ.</b> مخرجات ضارة من المساعد</li><li><b>ب.</b> تسرب بيانات شخصية</li><li><b>ج.</b> شبه حادثة بعدد صغير</li><li><b>د.</b> تجاوز المساعد صلاحياته في البحث عن الحجوزات</li></ul></li>
<li><p>بلاغ ضرره 2 (متوسط) ونطاقه 3 (من 101 إلى 10,000 شخص). ما شدته في مصفوفة مِجَنّ؟</p><ul><li><b>أ.</b> S4</li><li><b>ب.</b> S3</li><li><b>ج.</b> S2</li><li><b>د.</b> S1</li></ul></li>
<li><p>نصيحة كتبها مساعد ذكاء اصطناعي وتعرّض سلامة شخص واحد للخطر شدتها S4 في دليل مِجَنّ ما دام النطاق شخصًا واحدًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>نظام فواتير يرسل نحو ألفي فاتورة في اليوم، وتغيّر قالبه أمس. وصل اليوم بلاغ واحد عن مبلغ خاطئ. ما النطاق في الفرز الأول؟</p><ul><li><b>أ.</b> 4: أكثر من 10,000 فاتورة لو استمر الخلل شهرًا</li><li><b>ب.</b> 3: فواتير يوم كامل منذ تغيير القالب</li><li><b>ج.</b> 2: بلاغ واحد لا يدل على أكثر من مئة</li><li><b>د.</b> 1: البلاغ عن فاتورة واحدة</li></ul></li>
<li><p>وكيل تسعير في شركة أخرى يعطي أسعارًا خاطئة منذ تعديل إعداده، وتريد الإدارة التراجع فورًا. ما الخطوة التي تسبق التراجع؟</p><ul><li><b>أ.</b> كتابة تقرير المراجعة الكامل أولًا</li><li><b>ب.</b> انتظار شكوى ثانية تؤكد الخلل</li><li><b>ج.</b> سؤال المهندس عمّن طلب التعديل ومتى نُفذ وبأي صلاحية</li><li><b>د.</b> تصدير الإعداد الحالي والسجلات وحساب بصماتها</li></ul></li>
<li><p>إذا تغيّر حرف واحد في ملف، تتغير بصمة SHA-256 للملف كله.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي صياغة لعامل في التسلسل الزمني تتبع قاعدة الأسباب في النظام؟</p><ul><li><b>أ.</b> سمح نظام التغيير بنشر تعديل دون اختبار المرفقات (CHG-0211)</li><li><b>ب.</b> أهمل مهندس المنصة اختبار المرفقات قبل النشر</li><li><b>ج.</b> حدث خطأ في النشر لم يُعرف سببه بعد</li><li><b>د.</b> كان يجب أن يكون الفريق أكثر حرصًا في مراجعة كل تعديل قبل نشره</li></ul></li>
<li><p>في حادثة أخرى أُطلق تنبيه عن الخلل بعد ساعتين من بدايته، لكنه وُجّه إلى قناة لا يراقبها أحد. أي نوع من الضوابط أخفق هنا؟</p><ul><li><b>أ.</b> ضابط يمنع وقوع الخلل</li><li><b>ب.</b> ضابط يوقف الخلل بعد كشفه</li><li><b>ج.</b> ضابط يكشف الخلل</li><li><b>د.</b> لم يخفق أي ضابط، فقد أُطلق التنبيه</li></ul></li>
<li><p>وقع تسرب في اليوم الأول، وتسلّم موظف بلاغًا جادًا عنه في اليوم الثالث، واكتمل التحقيق في اليوم الخامس. من أي لحظة تُحسب الاثنتان والسبعون ساعة لإشعار الجهة المختصة؟</p><ul><li><b>أ.</b> من وقوع التسرب في اليوم الأول</li><li><b>ب.</b> من وقت العلم، حين تسلّم الموظف البلاغ</li><li><b>ج.</b> من اكتمال التحقيق في اليوم الخامس</li><li><b>د.</b> من أول شكوى لصاحب بيانات، أيًا كان وقتها</li></ul></li>
<li><p>إذا لم تكتمل بعض بيانات إشعار الجهة المختصة خلال 72 ساعة، تؤجل جهة التحكم الإشعار كله حتى تكتمل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>إشعار لصاحب بيانات يقول: «وصل مستند من مطالبتك إلى عميل آخر. قد يطّلع غيرك على بياناتك، وأوقفنا الإرسال الآلي. للتواصل: رقم الخدمة وبريد مسؤول حماية البيانات.» أي عنصر تطلبه اللائحة ينقصه؟</p><ul><li><b>أ.</b> وصف الحادثة</li><li><b>ب.</b> المخاطر المحتملة والتدابير المتخذة لمنعها أو الحد منها</li><li><b>ج.</b> بيانات التواصل</li><li><b>د.</b> التوصيات التي تساعده على الحد من المخاطر</li></ul></li>
<li><p>مورد يعالج بيانات عملاء لحساب شركة، فوقع عنده تسرب. ما الذي تطلبه اللائحة التنفيذية أن يتضمنه الاتفاق معه؟</p><ul><li><b>أ.</b> أن يُشعر الجهة المختصة مباشرة بدل الشركة</li><li><b>ب.</b> أن يُشعر الشركة، جهة التحكم، دون تأخر غير مبرر</li><li><b>ج.</b> أن يُشعر أصحاب البيانات خلال 72 ساعة من وقت علمه بالتسرب</li><li><b>د.</b> ألا يُشعر أحدًا حتى ينتهي تحقيقه</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من المراجعة إلى المراقبة</h2>
<ol>
<li><p>في مستشفى افتراضي، أرسل مساعد المواعيد تذكيرات بموعد خاطئ بعد أن نُقل جدول العيادات يدويًا دون مراجعة. كتبت المراجعة أربعة إجراءات مقترحة.</p><ul><li><b>أ.</b> تنبيه كتابي للموظف الذي نقل الجدول، وتدريبه على الإدخال خلال أسبوعين</li><li><b>ب.</b> مقارنة آلية بالأصل قبل النشر، يملكها مدير الأنظمة، خلال أسبوعين</li><li><b>ج.</b> أن تحرص الأقسام كلها على دقة البيانات مستقبلًا</li><li><b>د.</b> إيقاف مساعد المواعيد نهائيًا</li></ul></li>
<li><p>في بنك افتراضي، اختبرت عينة من 45 تحويلًا ضابط «موافقة ثانية على التحويلات فوق حد معيّن»، فوجدت استثناءً واحدًا وافق عليه فريق المناوبة الليلية.</p><ul><li><b>أ.</b> الضابط يعمل في نحو 98% من التحويلات</li><li><b>ب.</b> الضابط فعّال، فالاستثناء الواحد ضمن الهامش المقبول</li><li><b>ج.</b> اسحب عينة ثانية من 45 تحويلًا من الفترة نفسها، وقرر بنتيجة العينتين معًا</li><li><b>د.</b> غير فعّال؛ صفِّ تحويلات المناوبة الليلية كلها لمعرفة النطاق، ثم صعّد</li></ul></li>
<li><p>حادثة في مساعد للمواعيد يملكه مدير خدمة العملاء. من يقود المراجعة بلا لوم؟</p><ul><li><b>أ.</b> مدير خدمة العملاء، أعرف الحاضرين بالنظام</li><li><b>ب.</b> المهندس الذي نفذ آخر تغيير، أقرب الحاضرين إلى ما حدث</li><li><b>ج.</b> شخص من وحدة مستقلة عن النظام، ويحضر المالك والمهندس</li><li><b>د.</b> مدير الموارد البشرية في الجهة</li></ul></li>
<li><p>أي إجراء تصحيحي مكتوب كما يطلبه سجل المراجعة؟</p><ul><li><b>أ.</b> تحسين الرقابة على التغييرات في أقرب وقت</li><li><b>ب.</b> فريق المنصة يراجع إجراءات التغيير خلال الربع</li><li><b>ج.</b> تدريب جميع الموظفين على الحرص</li><li><b>د.</b> منع موافقة الطالب على تغييره في الأداة؛ المسؤول مدير المنصة؛ خلال أسبوعين؛ ويُختبر بعينة</li></ul></li>
<li><p>في المراجعة بلا لوم يُسأل كل حاضر عما رآه وما كان يعرفه وقت قراره.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في مراجعة حادثة مساعد هاتفي، كيف تعرف هل تضررت فئة أكثر من غيرها؟</p><ul><li><b>أ.</b> تقارن نسبة المتضررين في كل فئة من السجلات، وتذكر مصدر الأرقام</li><li><b>ب.</b> تسأل الحاضرين هل لاحظوا فئة بعينها</li><li><b>ج.</b> تعد الشكاوى من كل فئة</li><li><b>د.</b> تفترض أن الضرر متساوٍ بين الفئات كلها ما لم يشتك أحد من فئة بعينها</li></ul></li>
<li><p>بقاعدة مِجَنّ للمعاينة بالسمات، دون استثناء متوقع: ما حجم العينة لنسبة مقبولة 3% وثقة 95%؟</p><ul><li><b>أ.</b> 59 عنصرًا</li><li><b>ب.</b> 29 عنصرًا</li><li><b>ج.</b> 99 عنصرًا</li><li><b>د.</b> 3% من حجم المجتمع</li></ul></li>
<li><p>تُعاد عينة الضابط بعد كل تغيير في النظام الذي يحميه، ولو كانت آخر نتيجة «فعّال».</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وجدت استثناءين في عينة من 59 لضابط الموافقة على المدفوعات. ما الخطوة التالية في قاعدة مِجَنّ؟</p><ul><li><b>أ.</b> تسجيل النتيجة «فعّال»، فالاستثناءان أقل من 5%</li><li><b>ب.</b> توسيع الفحص بما يشترك فيه الاستثناءان لمعرفة النطاق، ثم التصعيد</li><li><b>ج.</b> سحب عينة جديدة لعلها تخلو من الاستثناءات</li><li><b>د.</b> حذف الاستثناءين لأنهما قد يكونان خطأ في السجل</li></ul></li>
<li><p>ضابط فحص المرفقات يشغّله فريق القنوات الرقمية ويملكه مديره. من يختبره في خطة المراقبة؟</p><ul><li><b>أ.</b> مدير القنوات الرقمية، مالك الضابط</li><li><b>ب.</b> المهندس الذي يشغّل الضابط</li><li><b>ج.</b> المورد الذي يقدم أداة الفحص</li><li><b>د.</b> وحدة مستقلة لا تشغّل الضابط</li></ul></li>
</ol>
